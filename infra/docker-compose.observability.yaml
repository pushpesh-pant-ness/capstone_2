# Observability stack via Docker Compose (BUILD_PLAN.md §3, Phase 1).
# Loki (logs) + Promtail (log shipper) + Prometheus (metrics) + Alertmanager
# (fires webhooks to the Agent Intake API) + Grafana (dashboards over the
# Prometheus/Loki data the agent also queries for investigation/RCA).
#
# Usage: docker compose -f infra/docker-compose.observability.yaml up -d

services:
  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      # host 3000 is already claimed by kind-cluster.yaml's control-plane
      # NodePort mapping, so this stack's Grafana lives on 3001 instead.
      - "3001:3000"
    environment:
      # Local dev only — anonymous Viewer access, no signup. Put real auth in
      # front of this before using it anywhere but a laptop/demo.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
