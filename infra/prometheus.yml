scrape_configs:
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      # Self metrics of infra/otel-collector-config.yaml's own collector —
      # confirms it's alive and shows receive/export rates for OTel Demo
      # traffic (logs -> Loki, metrics -> this same Prometheus via OTLP).
      - targets: ["otel-collector:8888"]

  - job_name: monitored-app
    metrics_path: /metrics
    static_configs:
      # Point at whatever the monitored application exposes (SRS.md A-1).
      # Example if running the OTel Demo in kind with a NodePort/port-forward:
      - targets: ["host.docker.internal:9464"]

  - job_name: kube-state-metrics
    metrics_path: /metrics
    static_configs:
      # kube-state-metrics running in the kind cluster, bridged to the host via
      # `kubectl port-forward -n otel-demo svc/ksm-kube-state-metrics 9101:8080`
      # — feeds the PodCrashLooping alert rule (kube_pod_container_status_restarts_total).
      - targets: ["host.docker.internal:9101"]

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
