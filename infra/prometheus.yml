scrape_configs:
  - job_name: monitored-app
    metrics_path: /metrics
    static_configs:
      # Point at whatever the monitored application exposes (SRS.md A-1).
      # Example if running the OTel Demo in kind with a NodePort/port-forward:
      - targets: ["host.docker.internal:9464"]

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
