# Minimal single-binary Loki deployment for local kind cluster (namespace: observability).
# Filesystem storage, no S3/GCS — fine for a local demo, not for production.
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi

# Disable extra components we don't need for a local demo
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

gateway:
  enabled: false

# Disable memcached-based caching layers — not needed for a small local demo
# and they were exceeding available node memory on kind.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

minio:
  enabled: false

test:
  enabled: false

lokiCanary:
  enabled: false
